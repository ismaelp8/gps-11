name: Python CI

on:
  pull_request:
    branches: [ "master", "main" ] # Corre els tests a una nova PR.

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Imatge docker de python 
    container:
      image: python:3.10-slim 

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Install requirements
        # Install requirement 
        run: |
          python -m pip install --upgrade pip
          pip install pylint coverage
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Analizador de código estático
        # Passar un analitzador de codi static (pylint) 
        run: |
          pylint main.py transform.py test.py --disable=C0114,C0116 # Desactiva avisos menores de docstrings si es necesario

      - name: Ejecutar tests y coverage
        # I executar el test i el seu coverage 
        run: |
          coverage run -m unittest test.py
          coverage report -m